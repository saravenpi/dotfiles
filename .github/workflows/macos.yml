name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tido:
    name: tido on bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The point of this job: macOS ships bash 3.2 (whose command-substitution
      # parser broke tido) and a BSD readlink without -f (which broke its path
      # resolution). Both are covered by running the linker for real below.
      - name: Confirm stock bash 3.2 and BSD readlink
        run: |
          set -euo pipefail
          /bin/bash --version > "$RUNNER_TEMP/bash-version.txt"
          grep -q 'version 3\.2\.' "$RUNNER_TEMP/bash-version.txt"
          if /usr/bin/readlink -f / >/dev/null 2>&1; then
            echo "expected /usr/bin/readlink to reject -f" >&2
            exit 1
          fi
          echo "using $(/bin/bash -c 'echo $BASH_VERSION') and BSD readlink"

      - name: Link into a scratch HOME
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          printf 'pre-existing\n' > "$HOME/.bashrc"

          /bin/bash --posix scripts/scripts/tido link

          test -L "$HOME/.bashrc"
          test -L "$HOME/.config/nvim"
          test -n "$(find "$HOME/.tido-backups" -name .bashrc)"

          # Linux-only desktop packages must not be linked on macOS.
          test ! -e "$HOME/.config/sway"
          test ! -e "$HOME/.config/hypr"
          test ! -e "$HOME/.config/foot"
          test ! -e "$HOME/.config/widgets"

          /bin/bash --posix scripts/scripts/tido list > "$RUNNER_TEMP/tido-list.txt"
          grep -q 'already linked' "$RUNNER_TEMP/tido-list.txt"
