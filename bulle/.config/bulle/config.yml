# bulle settings. The Bulle server owns the provider, the models, the
# assistant's persona, the Matrix bot and the scheduled jobs, so this file only
# holds what is local to a terminal. Your personal prompt is not tracked here:
# bulle reads it from BULLE_ADDITIONAL_PROMPT, which tiroir exports.

server:
  url: https://bulle.facile.studio

discovery:
  trust_skills: true
  trust_hooks: true

ui:
  prompt_placeholder: "Yooo, what we breaking today ?"

editor:
  editor: "nvim"

sources:
  mcp:
    mycelium:
      command: mycelium
      args: [mcp]
    sonar:
      command: sonar
      args: [mcp]

gates:
  - name: filet
    command: [filet, check]
    timeout_secs: 30
  - name: filet-fix
    command: [filet, clean]
    format: true
