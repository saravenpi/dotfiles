# Hyprland configuration.
#
# The Hyprland twin of ~/.config/sway/config: the same palette, the same desktop
# widgets, the same keybinds, and the same borderless, rounded look. Hyprland's
# configuration language (hyprlang) is its own, so the syntax differs line by
# line even where the two files say the same thing.

# Colors from `palette sync`: $palette_bg/fg/cursor, $palette_color0..15 and the
# three role variables $active_border / $inactive_border / $urgent_border.
# Sourced first so every rule below can use them.
source = ~/.config/hypr/palette.conf

# The wallpaper image `setwallpaper` recorded, as an `exec-once`. Written by
# setwallpaper and safe to be missing on a fresh checkout.
source = ~/.config/hypr/wallpaper.conf

$mod = SUPER
$term = foot

# Start the session's pieces at login:
#   statusbar  the top bar
#   sidebar    the notification daemon (it owns org.freedesktop.Notifications)
#   palette    re-applies the palette; the widgets watch their CSS file and
#              restyle themselves in place, no restart and no reload needed
exec-once = ~/.local/bin/statusbar
exec-once = ~/.local/bin/sidebar
exec-once = ~/.local/bin/palette sync --no-reload

# Every output, preferred mode, automatic scale and position (sway: `output *`).
monitor = , preferred, auto, auto

# Layout. The 6px outer gap and the 12px corner are the same measures the widgets
# use (`theme::GAP` and the surface radius), so a window lines up with the bar and
# the panels instead of clashing with them. Border size 0 removes the outline
# entirely; the border colors below only matter for the ring Hyprland draws when
# a border size is set, and are here so a later change stays on-palette.
general {
    gaps_in = 10
    gaps_out = 6
    border_size = 0
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    layout = dwindle
}

decoration {
    rounding = 12
}

# No animations: the desktop moves instantly, matching the widgets' flat look.
animations {
    enabled = false
}

# Keyboard and pointing devices, mirroring the sway input blocks.
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        middle_button_emulation = true
        disable_while_typing = true
    }
}

# Terminal, launcher and sidebar.
bind = $mod, RETURN, exec, $term
bind = $mod, SPACE, exec, ~/.local/bin/launcher
bind = $mod, N, exec, ~/.local/bin/sidebar toggle

# Session.
bind = $mod, Q, killactive
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exit

# Focus.
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, LEFT, movefocus, l
bind = $mod, DOWN, movefocus, d
bind = $mod, UP, movefocus, u
bind = $mod, RIGHT, movefocus, r

# Move the focused window.
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, DOWN, movewindow, d
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, RIGHT, movewindow, r

# Layout and windows: `e` flips the dwindle split, `f` fullscreens, `v` floats.
bind = $mod, E, togglesplit
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod SHIFT, SPACE, togglefloating

# Workspaces 1-10 and moving a window onto one.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Resize mode, `$mod+r`, mirroring sway's. `binde` repeats while the key is held.
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , LEFT, resizeactive, -10 0
binde = , RIGHT, resizeactive, 10 0
binde = , DOWN, resizeactive, 0 10
binde = , UP, resizeactive, 0 -10
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
submap = reset

# Hardware keys.
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
