# Starship prompt configuration.
#
# Minimal starter file: settings left unset keep Starship's defaults. Edit it
# to taste, apply a preset with `starship preset --list`, or see the full
# reference at https://starship.rs/config/.

# Blank line between the previous command output and the prompt.
add_newline = true

# Uncomment to shorten long directory paths in the prompt.
# [directory]
# truncation_length = 3

# Uncomment to show how long the last command took.
# [cmd_duration]
# min_time = 500
