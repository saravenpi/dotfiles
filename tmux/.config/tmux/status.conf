source-file -q ~/.config/tmux/palette.conf

set-option -g status on
set-option -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#{@palette_color8}] #S "

set -g status-style "bg=default,fg=default"
set -g window-status-style "bg=default,fg=#{@palette_color8}"
set -g window-status-current-style "bg=default,fg=default,bold"
set -g window-status-separator " "

set -g window-status-format " #W "
set -g window-status-current-format " #[fg=default,bold]#W "
