[filetype]
rules = [
{ mime = "**/image/*", fg = "#d6a163" },
{ mime = "**/{audio,video}/*", fg = "#ca9dc7" },
{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff8a70" },
{ mime = "**/application/{pdf,doc,rtf}", fg = "#79b7a8" },
{ mime = "vfs/{absent,stale}", fg = "#776b5f" },
{ url = "*", is = "orphan", bg = "#ff8a70" },
{ url = "*", is = "exec", fg = "#a2b275" },
{ url = "*", is = "dummy", bg = "#ff8a70" },
{ url = "*/", is = "dummy", bg = "#ff8a70" },
{ url = "*/", fg = "#5eb5e1" },
]
